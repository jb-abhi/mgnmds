<!doctype html>
<html lang="en">

  <meta charset="utf-8">
  <title>MGN Motor Driving School | Trivandrum | Kerala</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#101827">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('mgn_theme');
        var theme = (saved === 'dark' || saved === 'light')
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0B1220' : '#101827');
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Learn safe, defensive driving with MGN Motor Driving School in Trivandrum, Kerala.">
