<header class="ph" appReveal><div class="wrap"><h1>Contact us</h1><p class="lead">Call or message us. We reply during opening hours.</p></div></header>
<section class="wrap sec contact" appReveal>
  <div class="panel">
    <h2>Talk to us</h2>
    <p class="contact-actions">
      <a class="btn y" href="tel:{{ s.phone }}"><app-icon name="phone" />Call now</a>
      <a class="btn ln" [href]="'https://wa.me/' + s.whatsapp"><app-icon name="chat" />WhatsApp</a>
    </p>
    <h3>Address</h3><p>{{ s.address }}</p>
    <h3>Hours</h3><p>{{ s.hours }}</p>
  </div>
  <app-enquiry-form />
</section>
<section class="wrap sec map-section" aria-labelledby="map-title">
  <h2 id="map-title">Find us</h2>
  <p>{{ s.address }}</p>
  <div class="map-frame">
    <iframe [src]="mapEmbedUrl" title="Map showing MGN Motor Driving School" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
  </div>
  <!-- <p><a [href]="mapSearchUrl" target="_blank" rel="noopener noreferrer">Open in Google Maps</a></p> -->
</section>
