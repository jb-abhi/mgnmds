<header class="ph" appReveal><div class="wrap"><h1>Courses</h1><p class="lead">Licence categories we teach.</p></div></header>
<section class="wrap sec" appReveal>
  <ul class="rows light">
    @for (c of s.courses; track c.name; let i = $index) {
      <li [appReveal]="i"><h2>{{ c.name }}</h2><p>{{ c.text }}</p></li>
    }
  </ul>
  <p><a class="btn dk" routerLink="/contact">Ask about a course</a></p>
</section>
