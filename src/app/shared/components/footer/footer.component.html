<footer class="site-footer">
  <div class="wrap foot">
    <div>
      <p class="brand">{{ s.name }}</p>
      <p class="m">{{ s.tagline }}</p>
    </div>
    <div>
      <h2>Visit</h2>
      <p class="address">{{ s.address }}</p>
      <p>{{ s.hours }}</p>
    </div>
    <div>
      <h2>Reach us</h2>
      <p><a class="reach-link" href="tel:{{ s.phone }}"><app-icon name="phone" />{{ s.phoneDisplay }}</a></p>
      <p><a class="reach-link" [href]="'https://wa.me/' + s.whatsapp"><app-icon name="chat" />WhatsApp</a></p>
      <p><a class="reach-link" [href]="'mailto:' + s.email"><app-icon name="gmail" />{{ s.email }}</a></p>
      <p><a class="reach-link" [href]="s.social.facebook" target="_blank" rel="noopener noreferrer"><app-icon name="facebook" />Facebook</a></p>
      <p><a class="reach-link" [href]="s.social.youtube" target="_blank" rel="noopener noreferrer"><app-icon name="youtube" />YouTube</a></p>
    </div>
  </div>
  <div class="wrap footer-legal">
    <p>© {{ year }} {{ s.name }}. All rights reserved.</p>
    <p class="site-version">Version {{ s.version }}</p>
    <a routerLink="/privacy">Privacy policy</a>
  </div>
</footer>
