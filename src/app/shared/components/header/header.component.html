<header class="bar">
  <div class="wrap row">
    <a routerLink="/" class="brand" aria-label="MGN Motor Driving School home" (click)="open.set(false)">  
    <img
    src="/images/mgn-emblem-blue.png"
    alt=""
    class="brand-logo"
    #steeringLogo
    width="40"
    height="40"
  /><span class="brand-progress-fill brand-name-full" [style.--scroll-progress]="scrollProgress() + '%'">{{ s.name }}</span><span class="brand-progress-fill brand-name-short" [style.--scroll-progress]="scrollProgress() + '%'">MGN MDS</span></a>
    <nav id="nav" aria-label="Main" [class.open]="open()">
      <ul>
        @for (l of links; track l.p) {
          <li>
            <a [routerLink]="l.p" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }" (click)="open.set(false)">{{ l.t }}</a>
          </li>
        }
      </ul>
    </nav>
    <div class="header-actions">
      <button
        class="theme-toggle"
        type="button"
        (click)="themeService.toggleTheme($event)"
        [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
        <app-icon [name]="themeService.isDark() ? 'sun' : 'moon'" />
        <span class="sr">{{ themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode' }}</span>
      </button>
      <a class="btn y call" href="tel:{{ s.phone }}">
        <app-icon name="phone" />
        <span class="call-now-text">Call now</span>
      </a>
      <button class="burger" type="button" [attr.aria-expanded]="open()" aria-controls="nav" (click)="open.set(!open())">
        <app-icon [name]="open() ? 'close' : 'menu'" /><span class="sr">Menu</span>
      </button>
    </div>
  </div>
  <div class="road" aria-hidden="true"></div>
</header>
