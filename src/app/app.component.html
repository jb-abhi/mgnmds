<a class="skip" href="#main">Skip to content</a>
@if (toast.message()) {
  <div class="global-toast" [class.error-toast]="toast.isError()" role="status" aria-live="polite">
    {{ toast.message() }}
  </div>
}
@if (showIntro()) {
  <div class="intro-screen" [class.leaving]="introLeaving()" aria-hidden="true">
    <div class="intro-content">
      <div class="intro-emblem">
        <span class="intro-orbit"></span>
        <img src="/images/mgn-emblem.png" alt="" width="512" height="512" fetchpriority="high" />
      </div>
      <span class="intro-rule"></span>
      <p>{{ s.name }}</p>
      <small class="intro-version">Version {{ s.version }}</small>
    </div>
  </div>
}
<app-header />
<main id="main"><router-outlet /></main>
<app-footer />
<app-mobile-dock />
